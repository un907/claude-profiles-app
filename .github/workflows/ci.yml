# CI: build, unit-test and quality-ratchet every push and pull request.
# Release packaging lives in release.yml. This workflow proves the package compiles as a
# universal release binary, that ClaudeProfilesCore's tests pass, and that the lint /
# complexity / duplication numbers did not get worse than Scripts/quality-thresholds.env.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Same configuration as Scripts/build-app.sh (universal arm64 + x86_64) so link
      # errors (e.g. Sparkle rpath, missing x86_64 slice) surface here before a tag is pushed.
      - name: Build (release, universal)
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Test
        run: swift test

      # Tools for the quality ratchet, pinned to the versions the thresholds were measured
      # with (docs/QUALITY.md). A newer SwiftLint can change the warning count on its own,
      # which would trip the ratchet for reasons unrelated to the code.
      - name: Install quality tools
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          unzip -q -o "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "SWIFTLINT=$RUNNER_TEMP/swiftlint/swiftlint" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/swiftlint/swiftlint" version
          pip3 install lizard==1.24.1 || pip3 install --break-system-packages lizard==1.24.1
          python3 -m lizard --version

      # lint / ccn / dup only: mutation testing and runtime perf are too slow or need a
      # desktop session, and the clean compiler build is already covered above.
      - name: Quality ratchet (lint, complexity, duplication)
        run: Scripts/quality-metrics.sh --skip-compiler --skip-mutation --skip-perf --check-thresholds

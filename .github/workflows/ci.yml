# CI: build, unit-test and quality-ratchet every push and pull request.
# Release packaging lives in release.yml. This workflow proves the package compiles as a
# universal release binary, that ClaudeProfilesCore's tests pass, and that the lint /
# complexity / duplication numbers did not get worse than Scripts/quality-thresholds.env.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Same configuration as Scripts/build-app.sh (universal arm64 + x86_64) so link
      # errors (e.g. Sparkle rpath, missing x86_64 slice) surface here before a tag is pushed.
      - name: Build (release, universal)
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Test
        run: swift test

      # Tools for the quality ratchet. Versions float with Homebrew / PyPI / npm, so a new
      # SwiftLint release can change the warning count; see docs/QUALITY.md.
      - name: Install quality tools
        run: |
          brew install swiftlint
          pipx install lizard || pip3 install --user lizard

      # lint / ccn / dup only: mutation testing and runtime perf are too slow or need a
      # desktop session, and the clean compiler build is already covered above.
      - name: Quality ratchet (lint, complexity, duplication)
        run: Scripts/quality-metrics.sh --skip-compiler --skip-mutation --skip-perf --check-thresholds
